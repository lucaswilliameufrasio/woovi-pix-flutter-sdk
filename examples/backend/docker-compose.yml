name: woovi-pix-flutter-sdk-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: woovi_demo
      POSTGRES_PASSWORD: woovi_demo
      POSTGRES_DB: woovi_demo
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woovi_demo -d woovi_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
